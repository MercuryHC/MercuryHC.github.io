<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题切换测试</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
        .test-section {
            padding: 2rem;
            margin: 2rem 0;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
        }
        .color-demo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .color-box {
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .bg-primary { background: var(--bg-primary); color: var(--text-primary); }
        .bg-secondary { background: var(--bg-secondary); color: var(--text-primary); }
        .bg-tertiary { background: var(--bg-tertiary); color: var(--text-primary); }
        .accent-primary { background: var(--accent-primary); color: white; }
        .accent-secondary { background: var(--accent-secondary); color: white; }
    </style>
</head>
<body>
    <div class="debug-info" id="debugInfo">
        当前主题: <span id="currentTheme">未知</span><br>
        HTML data-theme: <span id="htmlTheme">未知</span><br>
        localStorage: <span id="localTheme">未知</span>
    </div>

    <div style="padding: 2rem; padding-top: 6rem;">
        <h1 style="text-align: center; color: var(--text-primary);">主题切换功能测试</h1>
        
        <div style="text-align: center; margin: 2rem 0;">
            <button class="theme-toggle" onclick="toggleTheme()" style="padding: 1rem 2rem; font-size: 1rem;">
                <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                切换主题
            </button>
        </div>

        <div class="test-section">
            <h2 style="color: var(--text-primary);">颜色变量测试</h2>
            <p style="color: var(--text-secondary);">这段文字使用 --text-secondary 颜色</p>
            <p style="color: var(--text-tertiary);">这段文字使用 --text-tertiary 颜色</p>
            
            <div class="color-demo">
                <div class="color-box bg-primary">主背景色</div>
                <div class="color-box bg-secondary">次背景色</div>
                <div class="color-box bg-tertiary">第三背景色</div>
                <div class="color-box accent-primary">主强调色</div>
                <div class="color-box accent-secondary">次强调色</div>
            </div>
        </div>

        <div class="test-section">
            <h2 style="color: var(--text-primary);">卡片组件测试</h2>
            <div class="card">
                <h3>这是一个测试卡片</h3>
                <p>卡片内容应该根据主题变化而改变颜色。</p>
                <p>背景色、文字颜色、边框颜色都应该响应主题切换。</p>
            </div>
        </div>

        <div class="test-section">
            <h2 style="color: var(--text-primary);">按钮测试</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-primary">主要按钮</button>
                <button class="btn btn-secondary">次要按钮</button>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        function updateDebugInfo() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || '未设置';
            const localTheme = localStorage.getItem('theme') || '未设置';
            
            document.getElementById('currentTheme').textContent = currentTheme;
            document.getElementById('htmlTheme').textContent = currentTheme;
            document.getElementById('localTheme').textContent = localTheme;
        }

        // 重写 toggleTheme 函数以添加调试信息
        const originalToggleTheme = window.toggleTheme;
        window.toggleTheme = function() {
            console.log('切换主题前:', document.documentElement.getAttribute('data-theme'));
            originalToggleTheme();
            console.log('切换主题后:', document.documentElement.getAttribute('data-theme'));
            updateDebugInfo();
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，初始化主题...');
            initializeTheme();
            updateDebugInfo();
            
            // 每秒更新一次调试信息
            setInterval(updateDebugInfo, 1000);
        });
    </script>
</body>
</html>
